plugins {
    id 'application'

    // The upstream plugin id `com.github.johnrengelman.shadow` stopped at 8.1.1 and does
    // not run on Gradle 9 (it uses task APIs that were removed). `com.gradleup.shadow`
    // is the maintained drop-in fork and exposes the exact same `shadowJar { }` DSL.
    // On Gradle 8 switch back to: id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'alienkrishn.qrylz'

// The version of the tool. This is the only place it is written down, the command line
// reads it from a resource that is generated from it.
version = '1.0.3'

// Compiled with whatever JDK runs Gradle, but the bytecode stays on Java 17 so the jar
// runs on older JVMs.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'alienkrishn.qrylz.Qrylz'
}

dependencies {
    implementation 'info.picocli:picocli:4.7.5'
    // ARSCLib carries the whole APK engine: ApkModule (read/write), ApkBundle (split
    // merging) and the binary AndroidManifest reader/writer. The separate APKEditor
    // artifact is only a command line wrapper around this and drags in a jcommand
    // dependency that the library itself does not need.
    implementation 'com.github.REAndroid:ARSCLib:V1.4.0'
    // DEX reading/writing/patching.
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.10'

    testImplementation project(':payload')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// The SDK and the NDK, the same way the payload project finds them.
def sdkDir = {
    def props = rootProject.file('local.properties')
    if (props.exists()) {
        def line = props.withReader { r -> r.readLines().find { it.startsWith('sdk.dir=') } }
        if (line != null) {
            return line.substring('sdk.dir='.length()).trim()
        }
    }
    return System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}

def ndkDir = {
    def dir = new File(sdkDir() ?: '', 'ndk')
    def found = dir.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
    return found ? found.last() : null
}

def cmakeBin = {
    def dir = new File(sdkDir() ?: '', 'cmake')
    def found = dir.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
    return found ? new File(found.last(), 'bin/cmake') : null
}

// The abis the native hook is built for.
def hookAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']

// The native hook is built with the NDK, one build directory per abi, and put into the
// jar, so that one download is enough to use the tool.
tasks.register('buildNativeHook', Exec) {
    group = 'build'
    description = 'Builds the native hook for every abi with the NDK.'
    workingDir = projectDir
    doFirst {
        if (ndkDir() == null || cmakeBin() == null) {
            throw new GradleException('The Android NDK and cmake are needed to build the native hook.')
        }
        def abis = hookAbis.join(' ')
        commandLine 'sh', '-c', """
            set -e
            for ABI in ${abis}; do
                echo "building the native hook for ${'$'}{ABI}"
                "${cmakeBin().absolutePath}" \
                    -DCMAKE_TOOLCHAIN_FILE="${ndkDir().absolutePath}/build/cmake/android.toolchain.cmake" \
                    -DANDROID_ABI="${'$'}{ABI}" \
                    -DANDROID_PLATFORM=android-24 \
                    -DCMAKE_BUILD_TYPE=Release \
                    -B "native/build/${'$'}{ABI}" native
                "${cmakeBin().absolutePath}" --build "native/build/${'$'}{ABI}"
            done
        """
    }
}

// payload.dex is produced by :payload:buildDex (SDK d8) and packaged as a resource
// so the CLI can find it on its own classpath. The native hook goes in the same way.
// The version ends up in the jar, so the command line always shows the version it was
// built with.
def versionResource = layout.buildDirectory.file('generated/qrylz-version.txt')
tasks.register('generateVersionResource') {
    def output = versionResource
    def value = project.version.toString()
    inputs.property('version', value)
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = value
    }
}

tasks.named('processResources') {
    dependsOn 'generateVersionResource'
    from(versionResource)
    dependsOn ':payload:buildDex'
    from(layout.projectDirectory.dir('payload/build/dex')) {
        include 'payload.dex'
    }
    dependsOn 'buildNativeHook'
    hookAbis.each { abi ->
        from(layout.projectDirectory.dir("native/build/${abi}")) {
            include 'libqrylz_hook.so'
            rename { "native/${abi}/libqrylz_hook.so" }
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'alienkrishn.qrylz.Qrylz'
    }
}

shadowJar {
    archiveBaseName = 'qrylz'
    archiveClassifier = ''
    archiveVersion = ''

    // DEX tooling and the CLI both look up implementations through the service loader.
    mergeServiceFiles()

    // ARSCLib ships the android framework apks as resources. They are only needed to
    // resolve framework resources, which is not what this tool does.
    exclude 'frameworks/android/**' 

    // Shrink the fat jar down to what is actually used.
    minimize()

    manifest {
        attributes 'Main-Class': 'alienkrishn.qrylz.Qrylz'
    }
}

// Convenience: ./gradlew run --args="-i in.apk -o out.apk"
tasks.named('run') {
    if (project.hasProperty('runArgs')) {
        args project.property('runArgs').toString().split('\\s+')
    }
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the template round-trip and apk path checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'alienkrishn.qrylz.payload.QrylzSelfTest'
}

tasks.named('check') {
    dependsOn 'selfTest'
}

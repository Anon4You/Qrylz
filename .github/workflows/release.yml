name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Point the build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the fat jar
        run: ./gradlew shadowJar

      - name: Build the native hook
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B native/build native
          cmake --build native/build --config Release

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          cp build/libs/qrylz.jar dist/qrylz.jar
          cp native/build/libqrylz_hook.so dist/libqrylz_hook.so
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Qrylz ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/qrylz.jar
            dist/libqrylz_hook.so
            dist/SHA256SUMS

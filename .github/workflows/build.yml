name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Point the build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the fat jar
        run: ./gradlew shadowJar

      - name: Build the native hook
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B native/build native
          cmake --build native/build --config Release

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          cp build/libs/qrylz.jar dist/qrylz.jar
          cp native/build/libqrylz_hook.so dist/libqrylz_hook.so

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qrylz
          path: dist/
          retention-days: 30
